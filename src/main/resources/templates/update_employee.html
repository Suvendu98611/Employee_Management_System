<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="ISO-8859-1">
    <title>Employee Management System</title>
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.1.3/css/bootstrap.min.css">
    
    <style>
        body {
            background-image: url('/images/updatepic.jpeg');
            background-size: cover;
            background-repeat: no-repeat;
            background-position: center center;
            min-height: 100vh;
  
            justify-content: center;
            align-items: center;
        }

        .container {
            background-color: rgba(255, 255, 255, 0.9);
            padding: 25px;
            border-radius: 10px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.2);
            max-width: 600px; 
            width: 100%;
        }

        h2 {
            font-family: 'Arial', sans-serif;
            color: #007bff;
            font-size: 2rem;
            margin-bottom: 20px;
        }

        .form-group label {
            font-weight: bold;
        }

        .form-control {
            border-radius: 8px;
            padding: 10px;
            font-size: 1rem;
        }

        .btn-update {
            border-radius: 25px;
            padding: 8px 20px;
            font-size: 1rem;
            background-color: #007bff;
            color: white;
            border: none;
            transition: background-color 0.3s ease, transform 0.2s ease;
        }

        .btn-update:hover {
            background-color: #0056b3;
            transform: scale(1.05);
        }

        .btn-back {
            border-radius: 25px;
            padding: 8px 20px;
            font-size: 1rem;
            background-color: #dc3545;
            color: white;
            border: none;
            transition: background-color 0.3s ease, transform 0.2s ease;
        }

        .btn-back:hover {
            background-color: #c82333;
            transform: scale(1.05);
        }

        .btn-link {
            color: #007bff;
            text-decoration: none;
            font-size: 1rem;
        }

        .btn-link:hover {
            text-decoration: underline;
        }

        .form-group .col-sm-9 {
            padding-right: 0;
        }
        .button-group {
            display: flex;
            justify-content: space-between;
            margin-top: 20px;
        }

        .button-group .btn, .button-group .btn-link {
            width: 48%; 
        }
        @media (max-width: 768px) {
            .container {
                padding: 15px;
            }

            h2 {
                font-size: 1.6rem;
            }

            .form-control {
                font-size: 0.9rem;
            }

            .btn-update {
                font-size: 0.9rem;
                padding: 8px 15px;
            }

            .btn-back {
                font-size: 0.9rem;
                padding: 8px 15px;
            }
        }
    </style>
</head>
<body>
    <nav class="navbar navbar-expand-md bg-dark navbar-dark">
        <a class="navbar-brand" href="#">Employee Management System</a>
        <button class="navbar-toggler" type="button" data-toggle="collapse" data-target="#collapsibleNavbar">
            <span class="navbar-toggler-icon"></span>
        </button>
    </nav>

    <div class="container mt-3 p-3 shadow rounded bg-light">
        <h2 class="mb-4 text-center"><b>Update Employee</b></h2>

        <!-- Update Form with Correct Action -->
        <form th:action="@{/updateEmployee}" th:object="${employee}" method="POST">
            <!-- Hidden field for employee ID -->
            <input type="hidden" th:field="*{id}"/>

            <div class="form-group row">
                <label class="col-sm-3 col-form-label">Employee ID</label>
                <div class="col-sm-9">
                    <input type="text" th:field="*{employeeId}" placeholder="Employee ID" class="form-control"/>
                </div>
            </div>

            <div class="form-group row">
                <label class="col-sm-3 col-form-label">First Name</label>
                <div class="col-sm-9">
                    <input type="text" th:field="*{firstName}" placeholder="First Name" class="form-control"/>
                </div>
            </div>

            <div class="form-group row">
                <label class="col-sm-3 col-form-label">Last Name</label>
                <div class="col-sm-9">
                    <input type="text" th:field="*{lastName}" placeholder="Last Name" class="form-control"/>
                </div>
            </div>

            <div class="form-group row">
                <label class="col-sm-3 col-form-label">Email</label>
                <div class="col-sm-9">
                    <input type="email" th:field="*{email}" placeholder="Email" class="form-control"/>
                </div>
            </div>

            <div class="form-group row">
                <label class="col-sm-3 col-form-label">Role</label>
                <div class="col-sm-9">
                    <input type="text" th:field="*{role}" placeholder="Role" class="form-control"/>
                </div>
            </div>

            <div class="form-group row">
                <label class="col-sm-3 col-form-label">Date of Joining</label>
                <div class="col-sm-9">
                    <input type="date" th:field="*{dateOfJoining}" class="form-control"/>
                </div>
            </div>

            <div class="button-group">
                <button type="submit" class="btn btn-update">Update</button>
                <a th:href="@{ / }" class="btn btn-back btn-link text-white text-decoration-none">Back to Employee List</a>
            </div>
        </form>
    </div>
</body>
</html>
