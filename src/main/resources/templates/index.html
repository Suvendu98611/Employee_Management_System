<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="ISO-8859-1">
    <title>Employee Management System</title>

    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.1.3/css/bootstrap.min.css" integrity="sha384-MCw98/SFnGE8fJT3GXwEOngsV7Zt27NXFoaoApmYm81iuXoPkFOJwJ8ERdknLPMO" crossorigin="anonymous">
    <style>
        body {
            background-image: url('/images/backpicemp.jpeg');
            background-size: cover;
            background-repeat: no-repeat;
            background-position: center center;
            min-height: 100vh;
        }

        .container {
            background-color: rgba(255, 255, 255, 0.9);
            padding: 2px;
            border-radius: 20px;
        }

        .table th, .table td {
            text-align: center;
            vertical-align: middle;
        }

        .table thead {
            background-color: #007bff;
            color: white;
        }

        .pagination a {
            color: #007bff;
            text-decoration: none;
        }

        .pagination .active a {
            background-color: #007bff;
            color: white;
        }

        .pagination .disabled a {
            color: grey;
        }

        .search-bar {
            margin-bottom: 1px;
        }
    </style>
</head>
<body>
	
	<nav class="navbar navbar-expand-md bg-dark navbar-dark">
	  <!-- Brand -->
	  <a class="navbar-brand" href="#">Employeee Management System</a>

	  <!-- Toggler/collapsibe Button -->
	  <button class="navbar-toggler" type="button" data-toggle="collapse" data-target="#collapsibleNavbar">
	    <span class="navbar-toggler-icon"></span>
	  </button>
	  </div>
	</nav>

<div class="container my-3">
    <h3 class="text-center mb-3"><b>Employee List</b></h3>

    <!-- Search Bar -->
    <form method="get" th:action="@{/searchEmployee}" class="d-flex justify-content-center mb-2 search-bar">
        <input type="text" name="search" th:value="${searchQuery}" class="form-control w-50" placeholder="Search by First Name, Last Name, Email, etc.">
        <button type="submit" class="btn btn-primary ml-1">Search</button>
    </form>

    <a th:href="@{/showNewEmployeeForm}" class="btn btn-success btn-lg mb-2 d-block mx-auto">Add Employee</a>

    <table class="table table-striped table-hover table-responsive-md shadow-lg">
        <thead>
        <tr>
            <th>S/N</th>
            <th>
                <a th:href="@{'/page/' + ${currentPage} + '?sortField=firstName&amp;sortDir=' + ${reverseSortDir}}" class="text-white">
                    First Name</a>
            </th>
            <th>
                <a th:href="@{'/page/' + ${currentPage} + '?sortField=lastName&amp;sortDir=' + ${reverseSortDir}}" class="text-white">
                    Last Name</a>
            </th>
            <th>
                <a th:href="@{'/page/' + ${currentPage} + '?sortField=email&amp;sortDir=' + ${reverseSortDir}}" class="text-white">
                    Email</a>
            </th>
            <th>
                <a th:href="@{'/page/' + ${currentPage} + '?sortField=employeeId&amp;sortDir=' + ${reverseSortDir}}" class="text-white">
                    ID</a>
            </th>
            <th>
                <a th:href="@{'/page/' + ${currentPage} + '?sortField=role&amp;sortDir=' + ${reverseSortDir}}" class="text-white">
                    Role</a>
            </th>
            <th>
                <a th:href="@{'/page/' + ${currentPage} + '?sortField=dateOfJoining&amp;sortDir=' + ${reverseSortDir}}" class="text-white">
                    Date of Joining</a>
            </th>
            <th>Actions</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="employee, iterStat : ${listEmployees}">
            <td th:text="${(currentPage - 1) * pageSize + iterStat.index + 1}"></td>
            <td th:text="${employee.firstName}"></td>
            <td th:text="${employee.lastName}"></td>
            <td th:text="${employee.email}"></td>
            <td th:text="${employee.employeeId}"></td>
            <td th:text="${employee.role}"></td>
            <td th:text="${employee.dateOfJoining}"></td>
            <td>
                <a th:href="@{/showFormForUpdate/{id}(id=${employee.id})}" class="btn btn-primary btn-sm d-inline-block mr-2">Update</a>
                <a th:href="@{/deleteEmployee/{id}(id=${employee.id})}" class="btn btn-danger btn-sm d-inline-block">Delete</a>
            </td>
        </tr>
        </tbody>
    </table>

    <div th:if="${totalPages > 1}">
        <div class="row justify-content-center">
            <div class="col-auto">
                <span class="h5">Total Rows: [[${totalItems}]]</span>
            </div>

            <div class="col-auto">
                <ul class="pagination">
                    <li class="page-item" th:classappend="${currentPage == 1} ? 'disabled'">
                        <a th:href="@{'/page/' + 1 + '?sortField=' + ${sortField} + '&sortDir=' + ${sortDir}}" class="page-link">First</a>
                    </li>

                    <li class="page-item" th:classappend="${currentPage == 1} ? 'disabled'">
                        <a th:href="@{'/page/' + ${currentPage - 1} + '?sortField=' + ${sortField} + '&sortDir=' + ${sortDir}}" class="page-link">Previous</a>
                    </li>

                    <span th:each="i : ${#numbers.sequence(1, totalPages)}">
                        <li class="page-item" th:classappend="${currentPage == i} ? 'active'">
                            <a th:href="@{'/page/' + ${i} + '?sortField=' + ${sortField} + '&sortDir=' + ${sortDir}}" class="page-link">[[${i}]]</a>
                        </li>
                    </span>

                    <li class="page-item" th:classappend="${currentPage == totalPages} ? 'disabled'">
                        <a th:href="@{'/page/' + ${currentPage + 1} + '?sortField=' + ${sortField} + '&sortDir=' + ${sortDir}}" class="page-link">Next</a>
                    </li>

                    <li class="page-item" th:classappend="${currentPage == totalPages} ? 'disabled'">
                        <a th:href="@{'/page/' + ${totalPages} + '?sortField=' + ${sortField} + '&sortDir=' + ${sortDir}}" class="page-link">Last</a>
                    </li>
                </ul>
            </div>
        </div>
    </div>

    <!-- Back to Full List button -->
	<div th:if="${searchQuery != null}" class="text-center mt-4">
	    <a th:href="@{/}" class="btn btn-secondary btn-lg">Back to Full List</a>
	</div>


</div>

</body>
</html>
