<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="ISO-8859-1">
    <title>Employee Management System</title>
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.1.3/css/bootstrap.min.css">
    
    <style>
        body {
            background-image: url('/images/addpic.webp');
            background-size: cover;
            background-repeat: no-repeat;
            background-position: center center;
            min-height: 100vh;
            
            justify-content: center;
            align-items: center;
        }

        .container {
            background-color: rgba(255, 255, 255, 0.2); 
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.2);
            max-width: 600px;
            width: 100%;
        }

        h2 {
            font-family: 'Arial', sans-serif;
            color: #007bff;
            font-size: 2rem;
        }

        .form-group label {
            font-weight: bold;
        }

        .form-control {
            border-radius: 8px;
            padding: 10px;
            font-size: 1rem;
        }

        .btn-success {
            border-radius: 25px;
            padding: 8px 20px;
            font-size: 1rem;
            transition: background-color 0.3s ease, transform 0.2s ease;
            color: white;
        }

        .btn-success:hover {
            background-color: #28a745; 
            transform: scale(1.1);
        }

        .btn-link {
            color: #007bff;
            text-decoration: none;
            font-size: 1rem;
        }

        .btn-link:hover {
            text-decoration: underline;
        }

        .btn-danger {
            border-radius: 25px; 
            padding: 8px 20px; 
            font-size: 1rem;
            transition: background-color 0.3s ease, transform 0.2s ease;
            color: white;
        }

        .btn-danger:hover {
            background-color: #dc3545;
            transform: scale(1.1);
        }

        @media (max-width: 768px) {
            .container {
                padding: 15px;
            }

            h2 {
                font-size: 1.6rem;
            }

            #one label {
                font-size: 1rem;
            }

            .form-control {
                font-size: 0.9rem;
            }

            .btn-success, .btn-danger {
                font-size: 0.9rem; 
                padding: 8px 15px;
            }
        }
    </style>
</head>
<body>
    <nav class="navbar navbar-expand-md bg-dark navbar-dark">
        <!-- Brand -->
        <a class="navbar-brand" href="#">Employee Management System</a>

        <!-- Toggler/collapsibe Button -->
        <button class="navbar-toggler" type="button" data-toggle="collapse" data-target="#collapsibleNavbar">
            <span class="navbar-toggler-icon"></span>
        </button>
    </nav>

    <div class="container mt-3 p-3 shadow rounded bg-light">
        <h2 class="mb-4 text-center"><b>Add New Employee</b></h2>

        <!-- Display error message if it exists -->
        <div th:if="${errorMessage != null}" class="alert alert-danger">
            <p th:text="${errorMessage}"></p>
        </div>

        <form th:action="@{/saveEmployee}" th:object="${employee}" method="POST">
            <div id="one" class="form-group row">
                <label class="col-sm-3 col-form-label">Employee ID</label>
                <div class="col-sm-9">
                    <input type="text" th:field="*{employeeId}" placeholder="Employee ID" class="form-control"/>
                </div>
            </div>

            <div id="one" class="form-group row">
                <label class="col-sm-3 col-form-label">First Name</label>
                <div class="col-sm-9">
                    <input type="text" th:field="*{firstName}" placeholder="First Name" class="form-control"/>
                </div>
            </div>

            <div id="one" class="form-group row">
                <label class="col-sm-3 col-form-label">Last Name</label>
                <div class="col-sm-9">
                    <input type="text" th:field="*{lastName}" placeholder="Last Name" class="form-control"/>
                </div>
            </div>

            <div id="one" class="form-group row">
                <label class="col-sm-3 col-form-label">Email</label>
                <div class="col-sm-9">
                    <input type="email" th:field="*{email}" placeholder="Email" class="form-control"/>
                </div>
            </div>

            <div id="one" class="form-group row">
                <label class="col-sm-3 col-form-label">Role</label>
                <div class="col-sm-9">
                    <input type="text" th:field="*{role}" placeholder="Role" class="form-control"/>
                </div>
            </div>

            <div id="one" class="form-group row">
                <label class="col-sm-3 col-form-label">Date of Joining</label>
                <div class="col-sm-9">
                    <input type="date" th:field="*{dateOfJoining}" class="form-control"/>
                </div>
            </div>

            <div class="form-group text-center">
                <button type="submit" class="btn btn-success px-5 d-inline-block">Save</button>
                <button class="btn btn-danger px-5 d-inline-block ml-3">
                    <a th:href="@{/}" class="text-white text-decoration-none">Back to Employee List</a>
                </button>
            </div>
        </form>
    </div>
</body>
</html>
